name: Publish to itch.io

# Pushing a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) on a
# commit that is on main builds the web game and uploads it with butler to
# https://echoness.itch.io/relic-revival-run-remake
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: itch-publish
  cancel-in-progress: false

env:
  ITCH_TARGET: echoness/relic-revival-run-remake:html5

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to check the tag is on main

      - name: Check the tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Not publishing."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Electron's binary is only needed for desktop packaging, not for the web build.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build # tsc --noEmit, then vite build into dist/

      - name: Install butler
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          echo "$HOME/butler" >> "$GITHUB_PATH"

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::error::The BUTLER_API_KEY repository secret is not set."
            exit 1
          fi
          butler push dist "$ITCH_TARGET" --userversion "${GITHUB_REF_NAME#v}"
